name: Product API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          echo "PORT=3000" > .env
          echo "MONGO_USERNAME=testuser" >> .env
          echo "MONGO_PASSWORD=testpassword123" >> .env
          echo "MONGO_URI=mongodb://testuser:testpassword123@localhost:27017/productdb?authSource=admin" >> .env

      - name: Start Docker Compose
        run: docker compose up -d --build

      - name: Check containers
        run: docker compose ps

      - name: Wait for Product API
        run: |
          sleep 10
          curl http://localhost:3000

      - name: Run tests
        run: npm test

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v
